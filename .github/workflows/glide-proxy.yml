name: glide-proxy
# Builds the 3Dfx particle-fix proxy (tools/glidelog) as glide2x.dll. Push a tag like v0.1 to attach it to a
# GitHub release. Main pushes and manual runs also provide a downloadable artifact.
# Install steps for Windows: docs/windows.md. The DLL is never committed (see .gitignore).
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld llvm
      - name: Build
        run: tools/glidelog/build.sh
      - name: Smoke test
        run: |
          dll=tools/glidelog/glide2x.dll
          test -s "$dll"
          # Older `file` calls the CPU "Intel 80386", newer ones "Intel i386".
          file "$dll" | tee /dev/stderr | grep -Eq 'PE32 executable.*DLL.*Intel (i386|80386)'
          grep -aq 'glidelog attached' "$dll"
      - uses: actions/upload-artifact@v4
        with:
          name: heavygear-glide-proxy
          path: tools/glidelog/glide2x.dll
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/glidelog/glide2x.dll
